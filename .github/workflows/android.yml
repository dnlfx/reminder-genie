name: Android

on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --stacktrace :core:test

      - name: Use the sideload signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sideload.jks"
            echo "RG_KEYSTORE_PATH=$RUNNER_TEMP/sideload.jks" >> "$GITHUB_ENV"
            echo "Signing with the sideload key."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 isn't set, so this APK is signed with a temporary key. It installs, but a later build signed with the real key can't update it."
          fi

      - name: Build the APK
        env:
          RG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RG_VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew --stacktrace :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/ReminderGenie.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ runner.temp }}/ReminderGenie.apk
          retention-days: 30

      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/core/build/reports/
            android/app/build/reports/
          retention-days: 14

  ui-tests:
    name: UI tests on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: ./gradlew --stacktrace :app:connectedDebugAndroidTest

      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: android/app/build/reports/androidTests/
          retention-days: 14

  release:
    name: Publish the APK
    needs: [build, ui-tests]
    # Not for pull requests from forks, which can't write releases.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Write the release notes
        run: |
          {
            echo "## Install on your phone"
            echo
            echo "1. On your Android phone, open this page and tap **ReminderGenie.apk** under Assets."
            echo "2. Open the download. If Android asks, allow your browser to install unknown apps, then tap **Install**."
            echo "3. Open Reminder Genie and allow notifications when asked."
            echo
            echo "To update later, install a newer APK the same way. Your items stay."
            echo
            if [ "$SIGNED" != "true" ]; then
              echo "> **Temporary signing key.** The repository's signing secrets aren't set yet, so a later build signed with the real key won't install over this one. Uninstall this build first, or export a backup in Settings and import it after."
              echo
            fi
            echo "Built from ${{ github.event.pull_request.head.sha || github.sha }}."
          } > notes.md

      - name: Update the preview release
        if: github.event_name == 'pull_request'
        run: |
          gh release delete android-preview --cleanup-tag --yes || true
          gh release create android-preview ReminderGenie.apk \
            --prerelease \
            --target "${{ github.event.pull_request.head.sha }}" \
            --title "Reminder Genie for Android (preview from PR #${{ github.event.pull_request.number }})" \
            --notes-file notes.md

      - name: Publish the release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          gh release create "android-v1.0.${{ github.run_number }}" ReminderGenie.apk \
            --target "${{ github.sha }}" \
            --title "Reminder Genie for Android 1.0.${{ github.run_number }}" \
            --notes-file notes.md \
            --latest
