name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit and UI tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Use the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Pick an iPhone simulator
        id: simulator
        run: |
          xcodebuild -version
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "No iPhone simulator available" >&2
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true

      - name: Build
        run: |
          xcodebuild build-for-testing \
            -project ReminderGenie.xcodeproj \
            -scheme ReminderGenie \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath DerivedData \
            | xcbeautify || exit ${PIPESTATUS[0]}

      - name: Unit tests
        run: |
          xcodebuild test-without-building \
            -project ReminderGenie.xcodeproj \
            -scheme ReminderGenie \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -only-testing:ReminderGenieTests \
            -resultBundlePath results/UnitTests.xcresult \
            | xcbeautify || exit ${PIPESTATUS[0]}

      - name: UI tests
        run: |
          xcodebuild test-without-building \
            -project ReminderGenie.xcodeproj \
            -scheme ReminderGenie \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -only-testing:ReminderGenieUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath results/UITests.xcresult \
            | xcbeautify || exit ${PIPESTATUS[0]}

      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: results/
          retention-days: 14
