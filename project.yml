# Optional: regenerate ReminderGenie.xcodeproj with XcodeGen (brew install xcodegen && xcodegen generate).
# The checked-in project already works in Xcode 16+, so this is only needed if you prefer XcodeGen.
name: ReminderGenie
options:
  bundleIdPrefix: com.dnlfx
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ReminderGenie:
    type: application
    platform: iOS
    sources: [ReminderGenie]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dnlfx.ReminderGenie
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Reminder Genie
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  ReminderGenieTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ReminderGenieTests]
    dependencies:
      - target: ReminderGenie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dnlfx.ReminderGenieTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ReminderGenie:
    build:
      targets:
        ReminderGenie: all
        ReminderGenieTests: [test]
    test:
      targets: [ReminderGenieTests]
